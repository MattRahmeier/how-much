<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOW Much!?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an evening sale room. Velvet back wall, two lots on marble plinths under spotlights, the auctioneer's question on a brass rail above. */
:root {
  --wall: #160910;
  --velvet: #3a0f1b;
  --velvet-deep: #24070f;
  --brass: #c9a35c;
  --brass-hi: #f0d79f;
  --brass-lo: #7d5f2c;
  --ivory: #f4ecdc;
  --muted: #bca595;
  --marble: #e7e0d2;
  --marble-shade: #b9ae9b;
  --win: #7cc79a;
  --lose: #e07a66;
  --ink: #1d1014;
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* the menu, results and notes use display:flex; hidden must still win */
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--wall);
  color: var(--ivory);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
.hall {
  position: relative;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(240,215,159,.10), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 6px, transparent 6px 34px, rgba(255,255,255,.035) 34px 40px, transparent 40px 62px),
    linear-gradient(180deg, var(--velvet) 0%, var(--velvet-deep) 62%, var(--wall) 100%);
  isolation: isolate;
}
.hall::after { /* floor */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.55));
  z-index: -1; pointer-events: none;
}
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mark { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-style: italic;
  font-size: clamp(30px, 6vw, 46px); line-height: 1; letter-spacing: -.01em;
  color: var(--brass-hi);
  text-shadow: 0 1px 0 var(--brass-lo), 0 0 28px rgba(240,215,159,.25);
}
h1 span { font-style: normal; }
.sale { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin-bottom: -4px; }
.tools { display: flex; gap: 8px; align-items: center; }
.ghost {
  appearance: none; border: 1px solid rgba(201,163,92,.45); background: rgba(0,0,0,.2); color: var(--brass-hi);
  font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
  padding: 9px 12px; border-radius: 2px; cursor: pointer;
}
.ghost:hover { background: rgba(201,163,92,.14); }
button:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }
.streak {
  font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--brass-hi);
  padding: 9px 12px; border: 1px solid rgba(201,163,92,.45); border-radius: 2px; background: rgba(201,163,92,.10);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.iconbtn {
  appearance: none; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; cursor: pointer;
  border: 1px solid rgba(201,163,92,.45); border-radius: 2px; background: rgba(0,0,0,.2); color: var(--brass-hi);
}
.iconbtn:hover { background: rgba(201,163,92,.14); }
.langpick { position: relative; order: 3; } /* last item: the top-right corner */
.langbtn, .langmenu button {
  appearance: none; display: flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap;
  font: 500 12px/1 var(--f-mono); letter-spacing: .08em; color: var(--brass-hi);
}
.langbtn { height: 32px; padding: 0 9px; border: 1px solid rgba(201,163,92,.45); border-radius: 2px; background: rgba(0,0,0,.2); }
.langbtn:hover, .langbtn[aria-expanded="true"] { background: rgba(201,163,92,.14); }
.langcur { display: flex; align-items: center; gap: 7px; }
.chev { width: 12px; height: 12px; color: var(--muted); }
.flag { width: 20px; height: 14px; flex: none; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.35); display: block; }
.langmenu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 100%;
  display: flex; flex-direction: column; padding: 4px; border-radius: 2px;
  background: var(--velvet-deep); border: 1px solid rgba(201,163,92,.45); box-shadow: 0 10px 24px rgba(0,0,0,.5);
}
.langmenu button { border: 0; background: transparent; padding: 8px 10px; border-radius: 2px; color: var(--ivory); }
.langmenu button:hover, .langmenu button:focus-visible { background: rgba(201,163,92,.16); }
.langmenu button[aria-selected="true"] { color: var(--brass-hi); }
.iconbtn svg { width: 16px; height: 16px; }
.iconbtn[aria-pressed="false"] { color: var(--muted); }
.iconbtn[aria-pressed="false"] .waves, .iconbtn[aria-pressed="true"] .mute { display: none; }

/* Rail: progress + question */
.rail { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.pips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.pip { width: 22px; height: 6px; border-radius: 1px; background: rgba(244,236,220,.14); transition: background .3s; }
.pip.now { background: var(--brass); box-shadow: 0 0 10px rgba(201,163,92,.6); }
.pip.ok { background: var(--win); }
.pip.no { background: var(--lose); }
.lotno { font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
.question {
  margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(22px, 4.4vw, 34px); line-height: 1.15;
  display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 14px; border-radius: 2px;
}
.question .qtext { text-wrap: balance; min-width: 0; }
.question em { font-style: italic; color: var(--brass-hi); }
.qicon { flex: none; width: clamp(30px, 5vw, 40px); height: clamp(30px, 5vw, 40px); }
.qicon.more { color: var(--win); }
.qicon.less { color: var(--lose); }
.question.flip { animation: flip 1.8s ease-out; }
@keyframes flip {
  0%, 20% { background: rgba(240,215,159,.32); box-shadow: 0 0 0 1px var(--brass-hi), 0 0 40px rgba(240,215,159,.35); transform: scale(1.06); }
  100% { background: transparent; box-shadow: 0 0 0 1px transparent; transform: none; }
}
.rulechange {
  font: 500 12px/1.3 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); padding: 6px 12px; border-radius: 2px;
  animation: flip 1.8s ease-out;
}

/* Stage */
#game { display: flex; flex-direction: column; gap: 18px; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: clamp(6px, 2vw, 22px); margin-top: 34px; }
#game { scroll-margin-top: 10px; }
.vs {
  align-self: center; font-family: var(--f-display); font-style: italic; font-size: clamp(18px, 3vw, 26px);
  color: var(--brass); padding-bottom: 140px;
}
.lot {
  position: relative; appearance: none; border: 0; background: none; color: inherit; font: inherit; text-align: center;
  padding: 0; cursor: pointer; min-width: 0; display: flex; flex-direction: column; align-items: center;
  -webkit-tap-highlight-color: transparent;
  --case: clamp(140px, calc((100svh - 470px) * .8), 280px); /* shrinks on short screens so the lots fit */
}
.lot[disabled] { cursor: default; }
.cap, .base, .shadow, .lotname, .plaque, .lotdetail span { display: block; }
.beam { /* spotlight behind the lot */
  position: absolute; left: 50%; top: -40px; width: 150%; height: 120%; transform: translateX(-50%);
  background:
    radial-gradient(ellipse 45% 30% at 50% 42%, rgba(255,236,190,.30), transparent 72%),
    conic-gradient(from 180deg at 50% 0%, transparent 157deg, rgba(255,236,190,.10) 168deg, rgba(255,236,190,.16) 180deg, rgba(255,236,190,.10) 192deg, transparent 203deg);
  pointer-events: none; z-index: -1; transition: opacity .4s; opacity: .85;
}
.lot:hover:not([disabled]) .beam, .lot:focus-visible .beam { opacity: 1; }
.vitrine { /* fixed-size case: only the photo inside scales, so the glass never changes between lots */
  --pad: 12%;
  position: relative; flex: none; aspect-ratio: 4 / 5;
  width: var(--case); max-width: 100%;
  border: 1px solid rgba(255,255,255,.22); border-bottom: 0;
  background: linear-gradient(115deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 38%, rgba(255,255,255,.06) 60%, rgba(255,255,255,.01));
  overflow: hidden;
  transition: transform .35s cubic-bezier(.2,.8,.2,1);
}
.vitrine > .photo, .vitrine > .nophoto { position: absolute; inset: var(--pad); }
.nophoto { display: grid; place-items: center; text-align: center; }
.vitrine::after { /* glass glare over the photo */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.14), transparent 30%, transparent 70%, rgba(255,255,255,.05));
}
.photo { /* sits inside the case's padding, never cropped */
  display: block; width: calc(100% - 2 * var(--pad)); height: calc(100% - 2 * var(--pad)); object-fit: contain;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)) drop-shadow(0 14px 16px rgba(0,0,0,.5));
}
.nophoto { font-family: var(--f-display); font-style: italic; color: var(--brass-hi); font-size: 15px; }
.lot:hover:not([disabled]) .vitrine { transform: translateY(-4px); }
/* Highlight the lot under the pointer, or while a finger is on it */
.lot:focus-visible:not([disabled]) .vitrine,
.lot:active:not([disabled]) .vitrine,
.lot.touching:not([disabled]) .vitrine {
  border-color: rgba(240,215,159,.75);
  box-shadow: 0 0 0 1px rgba(240,215,159,.45), 0 0 26px rgba(240,215,159,.2);
}
.lot:focus-visible:not([disabled]) .lotname,
.lot:active:not([disabled]) .lotname,
.lot.touching:not([disabled]) .lotname { box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 2px rgba(240,215,159,.55); }
@media (hover: hover) {
  .lot:hover:not([disabled]) .vitrine {
    border-color: rgba(240,215,159,.75);
    box-shadow: 0 0 0 1px rgba(240,215,159,.45), 0 0 26px rgba(240,215,159,.2);
  }
  .lot:hover:not([disabled]) .lotname { box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 2px rgba(240,215,159,.55); }
}
.vitrine, .lotname { transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .2s, box-shadow .2s; }
.foot .rate { display: block; margin-top: 4px; }
.plinth { width: min(100%, calc(var(--case) + 40px)); flex: 1; display: flex; flex-direction: column; align-items: center; }
.cap {
  width: 100%; height: 14px;
  background: linear-gradient(180deg, #f6f1e7, var(--marble) 50%, var(--marble-shade));
  box-shadow: 0 4px 10px rgba(0,0,0,.45);
}
.column {
  width: 88%; padding: 14px 8px 18px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.28), transparent 18%, transparent 80%, rgba(0,0,0,.35)),
    linear-gradient(160deg, rgba(255,255,255,.3) 0 2%, transparent 2% 30%, rgba(120,110,95,.12) 30% 31%, transparent 31%),
    linear-gradient(180deg, var(--marble), var(--marble-shade));
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  flex: 1; min-height: 196px;
}
.lotname { /* engraved name plaquette, slightly see-through over the marble */
  margin: 0; max-width: 100%; padding: 6px 10px 7px; border-radius: 2px;
  font-family: var(--f-display); font-weight: 700; color: var(--ink);
  font-size: clamp(14px, 2.6vw, 18px); line-height: 1.15; text-wrap: balance;
  background: linear-gradient(180deg, rgba(240,215,159,.55), rgba(201,163,92,.42));
  border: 1px solid rgba(125,95,44,.45);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 1px 2px rgba(0,0,0,.18);
}
.lotdetail { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
.lotdetail .made { color: #4a3a34; font-size: clamp(11px, 2vw, 13px); line-height: 1.3; text-wrap: balance; }
.lotdetail .cond {
  padding-top: 5px; border-top: 1px solid rgba(29,16,20,.18); min-width: 60%;
  font: 500 clamp(9.5px, 1.7vw, 11px)/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: #6b564c;
}
.plaque {
  margin-top: auto; width: 100%; max-width: 190px; padding: 8px 6px 7px; border-radius: 2px;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, var(--brass-lo));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 4px rgba(0,0,0,.35);
  color: var(--ink);
}
.plaque .k { display: block; font: 500 9px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; opacity: .7; }
.plaque .v { display: block; font: 500 clamp(15px, 3vw, 21px)/1.2 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 3px; }
.base { width: 100%; height: 12px; background: linear-gradient(180deg, var(--marble-shade), #8c826f); }
.shadow { width: 120%; height: 18px; background: radial-gradient(ellipse at center, rgba(0,0,0,.6), transparent 70%); }

.lot.settled .plaque { animation: settle .35s ease-out; }
@keyframes settle { 40% { transform: scale(1.07); } }
.countdown { display: flex; align-items: center; gap: 10px; font: 400 13px/1 var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.ring { position: relative; width: 34px; height: 34px; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring b { font: 500 13px/1 var(--f-mono); color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.lot.chosen .vitrine { border-color: var(--brass-hi); box-shadow: 0 0 0 1px var(--brass-hi), 0 0 30px rgba(240,215,159,.25); }
.lot.won .plaque { background: linear-gradient(180deg, #d9f3e2, var(--win) 50%, #3e8a5f); }
.lot.dim { opacity: .62; transition: opacity .4s; }
.stamp {
  position: absolute; top: 14%; left: 50%; transform: translateX(-50%) rotate(-9deg) scale(1.6); opacity: 0; z-index: 2;
  font: 700 clamp(12px, 2.4vw, 15px)/1 var(--f-mono); letter-spacing: .2em; text-transform: uppercase;
  padding: 6px 10px; border: 2px solid currentColor; border-radius: 2px; color: var(--win);
  background: rgba(22,9,16,.8); pointer-events: none; white-space: nowrap;
}
.stamp.show { animation: stamp .38s cubic-bezier(.3,1.6,.5,1) forwards; }
.stamp.bad { color: var(--lose); }
@keyframes stamp { to { opacity: 1; transform: translateX(-50%) rotate(-9deg) scale(1); } }

/* Verdict */
.verdict {
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  min-height: 250px; /* room for the full verdict, so answering never shifts the page */
}
.verdict p { margin: 0; max-width: 60ch; color: var(--muted); }
.verdict .head { font-family: var(--f-display); font-size: clamp(20px, 3.6vw, 26px); color: var(--ivory); font-style: italic; }
.verdict .head.ok { color: var(--win); }
.verdict .head.no { color: var(--lose); }
.verdict .rel { font-family: var(--f-display); font-size: clamp(17px, 3vw, 21px); color: var(--ivory); }
.verdict .rel b { color: var(--brass-hi); font-weight: 700; font-variant-numeric: tabular-nums; }
.verdict .buy { font-size: 14px; }
.verdict .buy b { color: var(--ivory); font-weight: 600; }
.swap { transition: opacity .28s ease; }
.swap.out { opacity: 0; }
.cta {
  appearance: none; border: 0; cursor: pointer; border-radius: 2px;
  padding: 12px 26px; font: 600 14px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(180deg, var(--brass-hi), var(--brass));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(0,0,0,.4);
}
.cta:hover { filter: brightness(1.06); }
.hint { font: 400 12px/1 var(--f-mono); color: rgba(188,165,149,.7); letter-spacing: .06em; }

/* Results */
.results { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.score { font-family: var(--f-display); font-weight: 700; font-size: clamp(64px, 14vw, 104px); line-height: 1; color: var(--brass-hi); }
.score small { font-size: .4em; color: var(--muted); font-weight: 500; }
.rank { margin: 0; font-family: var(--f-display); font-style: italic; font-size: clamp(22px, 4vw, 30px); }
.rankline { margin: -10px 0 0; color: var(--muted); max-width: 52ch; }
.grid { font-size: 22px; letter-spacing: 3px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.dailybox {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; width: 100%; max-width: 560px;
  background: rgba(201,163,92,.35); border: 1px solid rgba(201,163,92,.35);
}
.dailybox div { background: var(--velvet-deep); padding: 12px 6px; display: flex; flex-direction: column; gap: 4px; }
.dailybox b { font: 500 clamp(18px, 4vw, 24px)/1 var(--f-mono); color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.dailybox span { font: 400 10px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ledger {
  width: 100%; max-width: 720px; border-top: 1px solid rgba(201,163,92,.35); padding-top: 14px;
  display: flex; flex-direction: column; gap: 0; text-align: left;
}
.ledger h2 { margin: 0 0 6px; font: 500 12px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
.row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid rgba(244,236,220,.08); }
.row .mk { font-size: 13px; }
.row .mk.ok { color: var(--win); } .row .mk.no { color: var(--lose); }
.row .pair { min-width: 0; }
.row .pair b { font-weight: 600; }
.row .pair span { color: var(--muted); }
.row .pair .s { display: block; font: 400 11px/1.4 var(--f-mono); color: rgba(188,165,149,.75); }
.row .amt { font: 500 13px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ivory); white-space: nowrap; }
.toast { min-height: 18px; font: 400 12px/1.4 var(--f-mono); color: var(--win); }
.pastbtn { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; white-space: nowrap; }
.pastbtn svg { width: 14px; height: 14px; flex: none; }
.pastbtn[aria-pressed="true"] { background: rgba(201,163,92,.18); }
.rail .streak { padding: 6px 10px; font-size: 11px; }

/* Past sales */
.archive { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.archive h2 { margin: 0; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: clamp(26px, 5vw, 36px); color: var(--brass-hi); }
.archive .intro { margin: -6px 0 0; color: var(--muted); max-width: 52ch; }
.salelist { width: 100%; max-width: 620px; display: flex; flex-direction: column; border-top: 1px solid rgba(201,163,92,.35); }
.salerow {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left;
  padding: 12px 4px; border-bottom: 1px solid rgba(244,236,220,.08);
}
.salerow .no { font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); min-width: 52px; }
.salerow .when { font-family: var(--f-display); font-size: 18px; color: var(--ivory); }
.salerow .when small { display: block; font: 400 11px/1.4 var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.salerow .ghost { white-space: nowrap; }
.foot { text-align: center; font: 400 11px/1.5 var(--f-mono); color: rgba(188,165,149,.6); max-width: 70ch; margin: 6px auto 0; }

@media (max-width: 560px) {
  .vs { padding-bottom: 150px; }
  .column { min-height: 200px; padding: 10px 5px 12px; gap: 8px; }
  .vitrine { --pad: 10%; }
  .stage { margin-top: 24px; }
  .beam { width: 130%; }
}
@media (max-width: 480px) { .dailybox { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<div class="hall">
  <div class="wrap">
    <header>
      <div class="mark">
        <h1 id="brand">HOW <span>Much!?</span></h1>
      </div>

  const PNG = new Set(["batman1", "sm64", "smb", "zelda", "xmen1", "detective27"]);
  const imgSrc = id => `img/${id}.${PNG.has(id) ? "png" : "jpg"}`;

  // Every catalogue: lots 1-5 ask for the pricier lot ("more"), lots 6-10 for the cheaper one ("less").
  const HALF = 5;
  const CATALOGUE = [
    ["sm64", "zelda", "more"],
    ["nintendops", "dracula", "more"],
    ["superman", "pikachu", "more"],
    ["lugia", "charbase", "more"],
    ["beachbomb", "hulk181", "more"],
    ["bobafett", "charizard", "less"],
    ["lotus", "af15", "less"],
    ["smb", "action1", "less"],
    ["earthbound", "umbreon", "less"],
    ["action1", "slippers", "less"],
  ];

  const gapOk = (a, b) => Math.abs(LOTS[a].price - LOTS[b].price) / Math.max(LOTS[a].price, LOTS[b].price) >= 0.03;
  const ratio = (a, b) => Math.max(LOTS[a].price, LOTS[b].price) / Math.min(LOTS[a].price, LOTS[b].price);

  // Pairs lots off without repeats. Rivals come from the same shelf (comics, cards, games, art, memorabilia)
  // and within 8x of each other where possible; at most MAX_MIXED pairs a day mix two shelves.
  const MAX_MIXED = 3;
  function buildRounds(rnd) {
    const ids = Object.keys(LOTS).sort();
    for (let k = ids.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [ids[k], ids[j]] = [ids[j], ids[k]]; }
    const rounds = [];
    const pool = ids.slice();
    let mixed = 0;
    while (rounds.length < 10 && pool.length >= 2) {
      const a = pool.shift();
      const same = b => LOTS[b].cat === LOTS[a].cat;
      // now and then (until the daily cap) a deliberate cross-shelf surprise
      let cands = mixed < MAX_MIXED && rnd() < 0.15 ? pool.filter(b => !same(b) && gapOk(a, b) && ratio(a, b) <= 4) : [];
      if (!cands.length) cands = pool.filter(b => same(b) && gapOk(a, b) && ratio(a, b) <= 8);
      if (!cands.length) cands = pool.filter(b => same(b) && gapOk(a, b));
      if (!cands.length && mixed < MAX_MIXED) cands = pool.filter(b => gapOk(a, b) && ratio(a, b) <= 8);
      if (!cands.length) continue;
      if (!same(cands[0])) mixed++;
      const b = cands[Math.floor(rnd() * cands.length)];
      pool.splice(pool.indexOf(b), 1);
      const q = rounds.length < HALF ? "more" : "less";
      rounds.push(rnd() < 0.5 ? [a, b, q] : [b, a, q]);
    }
    return rounds;
  }

  // ---------- Daily catalogue: seeded by the calendar date, so everyone gets the same 10 lots ----------
  const LAUNCH = Date.UTC(2026, 9, 25); // Daily No. 1
  const pad2 = n => String(n).padStart(2, "0");
  function dayKey(offset = 0) {
    const t = new Date();
    t.setDate(t.getDate() + offset);
    return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`;
  }
  function dayNumber(key) {
    const [y, m, d] = key.split("-").map(Number);
    return Math.round((Date.UTC(y, m - 1, d) - LAUNCH) / 864e5) + 1;
  }
  function prettyDay(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(T.locale, { month: "short", day: "numeric", year: "numeric" });
  }
  function seededRandom(str) {
    let h = 2166136261;
    for (let k = 0; k < str.length; k++) { h ^= str.charCodeAt(k); h = Math.imul(h, 16777619); }
    return () => { // mulberry32
      h = (h + 0x6D2B79F5) | 0;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const dailyCatalogue = key => buildRounds(seededRandom("howmuch:v3:" + key));

  // Streaks live in this browser only.
  const STORE_KEY = "howmuch.daily.v3"; // bump to reset everyone's daily progress and streaks
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveStore(st) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch (e) { /* storage blocked */ }
  }
  function currentStreak(st) {
    return st.last === dayKey(0) || st.last === dayKey(-1) ? (st.streak || 0) : 0;
  }
  function recordDaily() {
    const st = loadStore();
    st.days = st.days || {};
    if (!st.days[S.day]) {
      st.streak = st.last === dayKey(-1) ? (st.streak || 0) + 1 : (st.last === S.day ? st.streak : 1);
      st.best = Math.max(st.best || 0, st.streak);
      st.last = S.day;
      st.days[S.day] = { rounds: S.rounds, results: S.results };
    }
    delete st.progress;
    saveStore(st);
    return st;
  }
  function saveProgress() {
    const st = loadStore();
    st.progress = { day: S.day, rounds: S.rounds, results: S.results };
    saveStore(st);
  }

  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  // Prices are stored in USD; the Brazilian version shows them in reais.

  const fullBRL = usd => {
    const v = usd * BRL_PER_USD;

  const shortBRL = usd => {
    const v = usd * BRL_PER_USD;

  const full = PT ? fullBRL : fullUSD;

  // Soft tones in place of a gavel; off with the speaker button.

  let actx = null;
  function tones(notes) {
    if (!soundOn) return;

      actx = actx || new (window.AudioContext || window.webkitAudioContext)();

        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.0001, t);

        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      });
    } catch (e) { /* audio unavailable */ }
  }
  const sfx = {
    tick:  () => tones([[2637, 0, 0.05]]),
    right: () => tones([[1568, 0, 0.12], [2349.3, 0.08, 0.2]]),

  // ---------- State ----------

  function fresh(mode, pastDay) {

  function renderPips() {

  function renderRound() {

    const Qel = $("question");

  function pick(n) {

    const ok = n === answer;
    S.results[S.i] = { ok, pick: n, answer };
    if (S.mode === "daily" && S.results.length < S.rounds.length) saveProgress();

    [0, 1].forEach(k => {

    const step = now => {
      if (!S.revealed || S.rounds[S.i] !== round) return; // round changed mid-animation
      const p = Math.min(1, (now - t0) / D);

      [0, 1].forEach(k => {

  }

  // What the price gap buys at current prices in USD (Oct 2026). One is picked at random each answer.
  const GOODS = [
    { pt: ["casa de preço mediano nos EUA", "casas de preço mediano nos EUA"], one: "median US home", many: "median US homes", price: 417500 },                         // NAR, Sep 2026
    { pt: ["carro zero", "carros zero"], one: "new car", many: "new cars", price: 50562 },                                        // Kelley Blue Book average, Sep 2026

    { pt: ["par de Air Jordan 1 High", "pares de Air Jordan 1 High"], one: "pair of Air Jordan 1 Highs", many: "pairs of Air Jordan 1 Highs", price: 185 },    // retail, 2026 releases
    { pt: ["grama de ouro", "gramas de ouro", 4014 / 31.1035], one: "ounce of gold", many: "ounces of gold", price: 4014 },                             // spot, Oct 25 2026
    { pt: ["grama de prata", "gramas de prata", 54.88 / 31.1035], one: "ounce of silver", many: "ounces of silver", price: 54.88 },                        // spot, Oct 25 2026
    { pt: ["quilo de cobre", "quilos de cobre", 6.48 / 0.45359], one: "pound of copper", many: "pounds of copper", price: 6.48 },                         // Oct 23 2026
    { pt: ["tonelada de minério de ferro", "toneladas de minério de ferro"], one: "tonne of iron ore", many: "tonnes of iron ore", price: 95.84 },                    // 62% Fe spot, Aug 2026
    { pt: ["quilo de urânio", "quilos de urânio", 89.63 / 0.45359], one: "pound of uranium", many: "pounds of uranium", price: 89.63 },                      // U3O8 spot, Sep 2026

    { pt: ["litro de tinta de impressora", "litros de tinta de impressora", 12400 / 3.78541], one: "gallon of printer ink", many: "gallons of printer ink", price: 12400 },            // median cartridge ink, 2026
    { pt: ["grama de açafrão", "gramas de açafrão"], one: "gram of saffron", many: "grams of saffron", price: 9 },                            // typical US retail
    { pt: ["fuzil AK-47", "fuzis AK-47"], one: "AK-47 rifle", many: "AK-47 rifles", price: 1000 },                                 // typical US retail, $800–1,200
    { pt: ["pistola Glock 19", "pistolas Glock 19"], one: "Glock 19 pistol", many: "Glock 19 pistols", price: 621 },                          // Gen 6 street price, 2026
    { pt: ["peso argentino", "pesos argentinos"], one: "Argentine peso", many: "Argentine pesos", price: 1 / 1510 },                       // ~1,510 ARS per USD, Sep 2026
  ];
  function buyWith(gap, item) {
    // pt entries may swap in a metric unit with its own USD price (grams, kilos, litres)
    const goods = GOODS.map(g => PT ? { one: g.pt[0], many: g.pt[1], price: g.pt[2] ?? g.price } : g);
    const fits = goods.filter(g => gap >= g.price);
    for (let k = fits.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [fits[k], fits[j]] = [fits[j], fits[k]]; }
    const lines = fits.slice(0, 1).map(g => { // one random comparison per answer
      const n = Math.floor(gap / g.price);
      return T.buy(item, num(n), n === 1 ? g.one : g.many);
    });
    return lines.length ? lines : [T.buyNone(item)];
  }
  let flipTimer = null;
  function swapText(el, html) {
    if (!el) return;
    el.classList.add("out");
    setTimeout(() => { el.innerHTML = html; el.classList.remove("out"); }, 280);
  }

  // 15-second countdown to the next lot after each answer.
  const AUTO_SECONDS = 15;
  let autoTimer = null;
  function stopAutoNext() { clearInterval(autoTimer); autoTimer = null; clearInterval(flipTimer); }
  function startAutoNext() {
    stopAutoNext();
    const end = performance.now() + AUTO_SECONDS * 1000;
    autoTimer = setInterval(() => {
      const left = Math.max(0, end - performance.now());
      const secs = Math.ceil(left / 1000);
      if ($("cdNum")) { $("cdNum").textContent = secs; $("cdText").textContent = secs; }
      if ($("cdArc")) $("cdArc").setAttribute("stroke-dashoffset", String(94.25 * (1 - left / (AUTO_SECONDS * 1000))));
      if (left <= 0) next();
    }, 200);
  }

  // Keep the question and both lots in view while playing; the page sizes the cases to fit the screen.
  function focusPlay() {
    const g = $("game");
    if (g.hidden || Math.abs(g.getBoundingClientRect().top - 10) < 4) return;
    g.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function next() {
    stopAutoNext();
    if (!S.revealed) return;
    if (S.i < S.rounds.length - 1) { S.i++; renderRound(); focusPlay(); }
    else { showResults(); sfx.done(); }
  }

  const RANKS = T.ranks;

  function shareText() {
    const score = S.results.filter(r => r.ok).length;
    const streak = S.mode === "daily" ? T.shareStreak(currentStreak(loadStore())) : "";
    return `${T.docTitle} · ${saleTitle()}\n${S.results.map(r => r.ok ? "🟩" : "🟥").join("")}\n${score}/${S.rounds.length}${streak}`;
  }

  function untilMidnight() {
    const now = new Date(), mid = new Date(now);
    mid.setHours(24, 0, 0, 0);
    const s = Math.max(0, Math.floor((mid - now) / 1000));
    return `${pad2(Math.floor(s / 3600))}:${pad2(Math.floor(s / 60) % 60)}:${pad2(s % 60)}`;
  }

  function showResults() {
    const score = S.results.filter(r => r.ok).length;
    const [, rank, line] = RANKS.find(r => score >= r[0]);
    const st = S.mode === "daily" ? recordDaily() : null;
    if (S.mode === "past") recordPast();
    updateChrome();
    $("game").hidden = true;
    $("archive").hidden = true;
    const R = $("results");
    R.hidden = false;
    const dailyBox = st ? `
      <div class="dailybox">
        <div><b>${currentStreak(st)}</b><span>${T.box[0]}</span></div>
        <div><b>${st.best || 0}</b><span>${T.box[1]}</span></div>
        <div><b>${Object.keys(st.days || {}).length}</b><span>${T.box[2]}</span></div>
        <div><b id="countdown">${untilMidnight()}</b><span>${T.box[3]}</span></div>
      </div>` : "";
    R.innerHTML = `
      <div class="lotno">${saleTitle()} · ${T.closed}</div>
      <div class="score">${score}<small>/${S.rounds.length}</small></div>
      <h2 class="rank">${rank}</h2>
      <p class="rankline">${line}</p>
      <div class="grid" aria-label="${T.gridLabel(score, S.rounds.length)}">${S.results.map(r => r.ok ? "🟩" : "🟥").join("")}</div>
      ${dailyBox}
      <div class="actions">
        <button class="cta" id="shareBtn" type="button">${T.copy}</button>
        <button class="ghost" id="toPast" type="button">${T.past}</button>
        ${S.mode === "past" ? `<button class="ghost" id="toToday" type="button">${T.pastBack}</button>` : ""}
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="ledger">
        <h2>${T.ledger}</h2>
        ${S.rounds.map(([a, b, q], k) => {
          const r = S.results[k];
          const w = LOTS[[a, b][r.answer]], l = LOTS[[a, b][1 - r.answer]];
          return `<div class="row">
            <span class="mk ${r.ok ? "ok" : "no"}">${r.ok ? "✓" : "✕"}</span>
            <span class="pair"><b>${w.name}</b> <span>${q === "more" ? T.beat : T.under} ${l.name}</span>
              <span class="s">${w.sold} · ${l.sold}</span></span>
            <span class="amt">${short(w.price)}<br><span style="color:var(--muted)">${short(l.price)}</span></span>
          </div>`;
        }).join("")}
      </div>`;
    $("shareBtn").addEventListener("click", () => {
      const txt = shareText();
      const done = () => { $("toast").textContent = T.copied; };
      try {
        navigator.clipboard.writeText(txt).then(done, () => { $("toast").textContent = txt.replace(/\n/g, "  "); });
      } catch (e) { $("toast").textContent = txt.replace(/\n/g, "  "); }
    });
    $("toPast").addEventListener("click", showArchive);
    if ($("toToday")) $("toToday").addEventListener("click", () => setMode("daily"));
    if (st) {
      const today = S.day;
      countdownTimer = setInterval(() => {
        if (dayKey(0) !== today && S.mode === "daily") { startDaily(); return; }
        const c = $("countdown");
        if (c) c.textContent = untilMidnight();
      }, 1000);
    }
  }

  const validRounds = rounds => Array.isArray(rounds) && rounds.every(r => LOTS[r[0]] && LOTS[r[1]]);
  function startDaily() {
    S = fresh("daily");
    const st = loadStore();
    const done = st.days && st.days[S.day];
    if (done && validRounds(done.rounds || S.rounds)) {
      if (done.rounds) S.rounds = done.rounds;
      S.results = done.results; S.i = S.rounds.length - 1; showResults(); return;
    }
    const pr = st.progress;
    if (pr && pr.day === S.day && validRounds(pr.rounds || S.rounds)) {
      if (pr.rounds) S.rounds = pr.rounds;
      S.results = pr.results; S.i = S.results.length;
    }
    renderRound();
  }
  function setMode(m) {
    stopAutoNext();
    if (m === "daily") startDaily(); else { S = fresh(m); renderRound(); }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------- Past sales: every earlier daily catalogue, replayable without touching the streak ----------
  function pastRecord(st, key) {
    const r = (st.days && st.days[key]) || (st.past && st.past[key]);
    return r && validRounds(r.rounds || dailyCatalogue(key)) ? r : null;
  }
  function recordPast() {
    const st = loadStore();
    st.past = st.past || {};
    if (!(st.days && st.days[S.day])) st.past[S.day] = { rounds: S.rounds, results: S.results };
    saveStore(st);
  }
  function showArchive() {
    stopAutoNext();
    clearInterval(countdownTimer);
    const st = loadStore();
    const keys = [];
    for (let k = -1; keys.length < 90; k--) {
      const key = dayKey(k);
      if (dayNumber(key) < 1) break;
      keys.push(key);
    }
    $("game").hidden = true;
    $("results").hidden = true;
    const A = $("archive");
    A.hidden = false;
    A.innerHTML = `
      <h2>${T.past}</h2>
      <p class="intro">${keys.length ? T.pastIntro : T.pastNone}</p>
      ${keys.length ? `<div class="salelist">${keys.map(key => {
        const r = pastRecord(st, key);
        const score = r ? r.results.filter(x => x.ok).length : null;
        return `<div class="salerow">
          <span class="no">${T.pastNo(dayNumber(key))}</span>
          <span class="when">${prettyDay(key)}${r ? `<small>${T.pastScore(score, (r.rounds || r.results).length)} · ${r.results.map(x => x.ok ? "🟩" : "🟥").join("")}</small>` : ""}</span>
          <button class="ghost" type="button" data-day="${key}">${r ? T.pastReview : T.pastPlay}</button>
        </div>`;
      }).join("")}</div>` : ""}
      <button class="cta" id="archBack" type="button">${T.pastBack}</button>`;
    A.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => playPast(b.dataset.day)));
    $("archBack").addEventListener("click", () => setMode("daily"));
    $("pastBtn").setAttribute("aria-pressed", "true");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function playPast(key) {
    stopAutoNext();
    S = fresh("past", key);
    const r = pastRecord(loadStore(), key);
    if (r) {
      if (r.rounds) S.rounds = r.rounds;
      S.results = r.results; S.i = S.rounds.length - 1; S.revealed = true; showResults();
    } else renderRound();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------- Wiring ----------
  document.documentElement.lang = T.lang;
  document.title = T.docTitle;
  $("brand").innerHTML = T.brand;
  $("vsWord").textContent = T.vs;
  $("foot").textContent = T.foot;
  $("pastLabel").textContent = T.past;
  $("pastBtn").addEventListener("click", () => $("archive").hidden ? showArchive() : setMode("daily"));
  if (T.footRate) $("foot").insertAdjacentHTML("beforeend", `<span class="rate">${T.footRate}</span>`);
  // Touch screens have no hover: mark the lot while a finger is on it.
  ["lot0", "lot1"].forEach(id => {
    const el = $(id);
    el.addEventListener("touchstart", () => el.classList.add("touching"), { passive: true });
    ["touchend", "touchcancel"].forEach(ev => el.addEventListener(ev, () => el.classList.remove("touching"), { passive: true }));
  });

  // Language menu: flag + PT-BR / EN. Picking one saves it and reloads in that language.
  const FLAGS = {
    pt: `<svg class="flag" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#009c3b"/><path d="M10 1.6 18.2 7 10 12.4 1.8 7Z" fill="#ffdf00"/><circle cx="10" cy="7" r="3.1" fill="#002776"/><path d="M7.1 6.3q2.9-.9 5.8.6" stroke="#fff" stroke-width=".6" fill="none"/></svg>`,
    en: `<svg class="flag" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#fff"/><g fill="#b22234">${[0, 2, 4, 6, 8, 10, 12].map(k => `<rect y="${k * 14 / 13}" width="20" height="${14 / 13}"/>`).join("")}</g><rect width="8.6" height="${7 * 14 / 13}" fill="#3c3b6e"/></svg>`,
  };
  const LANG_LABEL = { pt: "PT-BR", en: "EN" };
  const cur = PT ? "pt" : "en";
  $("langCur").innerHTML = `${FLAGS[cur]}<span>${LANG_LABEL[cur]}</span>`;
  $("langBtn").setAttribute("aria-label", PT ? "Idioma: Português (Brasil)" : "Language: English");
  document.querySelectorAll("#langMenu [data-lang]").forEach(b => {
    const l = b.dataset.lang;
    b.innerHTML = `${FLAGS[l]}<span>${LANG_LABEL[l]}</span>`;
    b.setAttribute("aria-selected", String(l === cur));
    b.addEventListener("click", () => {
      closeLangMenu();
      if (l === cur) return;
      try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* storage blocked */ }
      if (/^#(pt|en)$/i.test(location.hash)) location.hash = "#" + l; // keep a forced link from overriding the pick
      location.reload();
    });
  });
  function closeLangMenu() { $("langMenu").hidden = true; $("langBtn").setAttribute("aria-expanded", "false"); }
  $("langBtn").addEventListener("click", e => {
    e.stopPropagation();
    const open = $("langMenu").hidden;
    $("langMenu").hidden = !open;
    $("langBtn").setAttribute("aria-expanded", String(open));
    if (open) $("langMenu").querySelector('[aria-selected="true"]').focus();
  });
  document.addEventListener("click", e => { if (!$("langPick").contains(e.target)) closeLangMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeLangMenu(); } });
  $("lot0").addEventListener("click", () => pick(0));
  $("lot1").addEventListener("click", () => pick(1));
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("howmuch.sound", soundOn ? "on" : "off"); } catch (e) { /* storage blocked */ }
    paintSound();
    if (soundOn) sfx.right();
  });
  paintSound();
  document.addEventListener("keydown", e => {
    if ($("game").hidden) return;
    if (!S.revealed && (e.key === "ArrowLeft" || e.key === "1")) pick(0);
    else if (!S.revealed && (e.key === "ArrowRight" || e.key === "2")) pick(1);
    else if (S.revealed && e.key === "Enter" && $("nextBtn") && document.activeElement !== $("nextBtn")) next();
  });

  window.claude?.hot?.snapshot?.(() => ({ S }));
  const start = data => {
    const old = data && data.S;
    if (!(old && validRounds(old.rounds)) || old.mode !== "daily" || old.day !== dayKey(0) || old.store !== STORE_KEY) { startDaily(); return; }
    S = old;
    if (S.results.length === S.rounds.length) showResults();
    else { if (S.results[S.i]) S.i = Math.min(S.i + 1, S.rounds.length - 1); renderRound(); }
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</html>
